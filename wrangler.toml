name = "meadowridgey"
main = "worker.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/classroom/*", "/api/bean/*", "/api/hide/*", "/api/space/*", "/api/evolution/*", "/api/battle/*"]

[[durable_objects.bindings]]
name = "CLASSROOMS"
class_name = "ClassroomRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassroomRoom"]

[[durable_objects.bindings]]
name = "BEAN_ARENAS"
class_name = "BeanArena"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BeanArena"]

[[durable_objects.bindings]]
name = "HIDE_ROOMS"
class_name = "HideSeekRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HideSeekRoom"]

[[durable_objects.bindings]]
name = "SPACE_ROOMS"
class_name = "SpaceCrewRoom"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SpaceCrewRoom"]

[[durable_objects.bindings]]
name = "EVOLUTION_ROOMS"
class_name = "EvolutionRoom"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["EvolutionRoom"]

[[durable_objects.bindings]]
name = "BATTLE_ROOMS"
class_name = "TeamBattleRoom"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["TeamBattleRoom"]
